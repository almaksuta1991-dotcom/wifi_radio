name: Build ESP32-S3 Binary

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Update index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 Core
        run: arduino-cli core install esp32:esp32

      - name: Install Audio Library via Git
        run: |
          mkdir -p ~/Arduino/libraries
          git clone https://github.com/schreibfaul1/ESP32-audioI2S.git ~/Arduino/libraries/ESP32-audioI2S

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app --output-dir ./build .

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-Firmware
          path: ./build/*.bin
